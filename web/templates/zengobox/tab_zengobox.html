{{define "tab_zengobox.html"}}
                <!-- TAB: ZENGOBOX -->
                <div x-show="activeTab === 'zengobox'" class="space-y-6" x-init="fetchZengobox()">
                    <!-- Master Control Panel header -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                            <h2 class="text-lg font-extrabold text-white tracking-wide uppercase">ZenGoBox</h2>
                            <p class="text-xs text-gray-400">Master Control Panel</p>
                        </div>
                        <div class="flex items-center gap-2 flex-wrap">
                            <div class="inline-flex items-center gap-2">
                                <button @click="zbControl('start')" :disabled="zbActionBusy"
                                    class="px-3 py-1.5 rounded-xl text-xs font-extrabold uppercase tracking-wider bg-green-500/15 border border-green-500/40 text-green-300 hover:bg-green-500/25 transition-colors disabled:opacity-40">▶ Start</button>
                                <button @click="zbControl('stop')" :disabled="zbActionBusy"
                                    class="px-3 py-1.5 rounded-xl text-xs font-extrabold uppercase tracking-wider bg-red-500/15 border border-red-500/40 text-red-300 hover:bg-red-500/25 transition-colors disabled:opacity-40">⏹ Stop</button>
                                <button @click="zbControl('restart')" :disabled="zbActionBusy"
                                    class="px-3 py-1.5 rounded-xl text-xs font-extrabold uppercase tracking-wider bg-white/5 border border-white/15 text-gray-300 hover:border-[#f97815]/60 transition-colors disabled:opacity-40">↻ Restart</button>
                            </div>
                            <div class="inline-flex items-center gap-2 bg-white/5 border border-white/10 rounded-xl px-3 py-1.5">
                            <template x-if="zbLoading">
                                <span class="flex items-center gap-2 text-xs font-bold text-gray-400">
                                    <span class="w-2 h-2 rounded-full bg-[#f97815] animate-ping"></span> Connecting...
                                </span>
                            </template>
                            <template x-if="!zbLoading && zbStatus">
                                <span class="flex items-center gap-2 text-xs font-extrabold uppercase tracking-wider">
                                    <span class="w-2 h-2 rounded-full"
                                        :class="zbStatus.running ? 'bg-green-400 shadow-[0_0_8px_rgba(74,222,128,0.9)]' : 'bg-red-400'"></span>
                                    <span :class="zbStatus.running ? 'text-green-400' : 'text-red-400'"
                                        x-text="zbStatus.running ? 'Active' : 'Offline'"></span>
                                    <span class="text-gray-500 font-mono normal-case tracking-normal"
                                        x-text="zbStatus.mode ? zbStatus.mode.toUpperCase() : ''"></span>
                                </span>
                            </template>
                            <template x-if="!zbLoading && !zbStatus">
                                <span class="text-xs font-bold text-red-400">Unreachable</span>
                            </template>
                        </div>
                    </div>
                    </div>

                    <!-- Setup notice + wizard -->
                    <template x-if="zbStatus && zbStatus.needs_setup">
                        <div class="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-5">
                            <div class="flex items-start gap-3">
                                <span class="text-2xl">📦</span>
                                <div class="flex-1">
                                    <p class="text-sm font-extrabold text-amber-300 uppercase tracking-wider">Core not installed</p>
                                    <p class="text-xs text-gray-400 mt-1">No proxy core binary found yet. Download one with the setup wizard below.</p>
                                    <button @click="zbShowSetup = !zbShowSetup"
                                        class="mt-3 px-4 py-2 rounded-xl text-xs font-extrabold uppercase tracking-wider bg-[#f97815]/15 border border-[#f97815]/50 text-[#f97815] hover:bg-[#f97815]/25 transition-colors">🧙 Setup Wizard</button>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Setup wizard panel -->
                    <template x-if="zbShowSetup">
                        <div class="bg-card border border-border rounded-2xl p-5">
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400">🧙 Core &amp; Dashboard Installer</h3>
                                <button @click="zbShowSetup = false; zbStopSetupPoll()" class="text-xs text-gray-500 hover:text-white">✕ Close</button>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                                <div>
                                    <label class="text-[10px] font-bold uppercase tracking-wider text-gray-500 block mb-1">Core</label>
                                    <select x-model="zbSetupCore" :disabled="zbSetupRunning"
                                        class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-[#f97815]/60">
                                        <option value="sing-box">Sing-Box</option>
                                        <option value="clash">Clash (Mihomo)</option>
                                        <option value="all">Both cores</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold uppercase tracking-wider text-gray-500 block mb-1">Version (empty = latest)</label>
                                    <input x-model="zbSetupVersion" :disabled="zbSetupRunning" type="text" placeholder="e.g. 1.12.0"
                                        class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder-gray-600 outline-none focus:border-[#f97815]/60">
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold uppercase tracking-wider text-gray-500 block mb-1">Dashboard</label>
                                    <select x-model="zbSetupDashboard" :disabled="zbSetupRunning"
                                        class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-[#f97815]/60">
                                        <template x-for="opt in zbDashboardOptions()" :key="opt.v">
                                            <option :value="opt.v" x-text="opt.t"></option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                            <button @click="zbStartSetup()" :disabled="zbSetupRunning"
                                class="px-4 py-2.5 rounded-xl text-xs font-extrabold uppercase tracking-wider bg-[#f97815] text-black hover:brightness-110 transition disabled:opacity-40">
                                <span x-text="zbSetupRunning ? '⏳ Installing...' : (zbSetupDone ? '↻ Reinstall' : '🚀 Begin Installation')"></span>
                            </button>
                            <template x-if="zbSetupFailed">
                                <button @click="zbStartSetup()" class="ml-2 px-4 py-2.5 rounded-xl text-xs font-extrabold uppercase tracking-wider bg-white/5 border border-white/15 text-gray-300">🔁 Retry</button>
                            </template>
                            <div class="mt-4">
                                <pre id="zb-setup-log" x-text="zbSetupLog"
                                    class="h-44 overflow-y-auto bg-black/40 border border-white/10 rounded-xl p-3 text-[11px] font-mono text-gray-300 whitespace-pre-wrap"></pre>
                                <p class="text-center text-xs font-bold mt-2"
                                    :class="zbSetupDone ? 'text-green-400' : (zbSetupFailed ? 'text-red-400' : 'text-[#f97815]')">
                                    <span x-text="zbSetupDone ? 'Setup complete! Restarting daemon...' : (zbSetupFailed ? 'Setup failed — see log above' : '')"></span>
                                </p>
                            </div>
                        </div>
                    </template>

                    <!-- Status cards -->
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-card border border-border rounded-2xl p-5">
                            <p class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Status</p>
                            <p class="text-2xl font-extrabold"
                                :class="zbStatus && zbStatus.running ? 'text-green-400' : 'text-red-400'"
                                x-text="zbLoading ? '...' : (zbStatus && zbStatus.running ? 'Running' : 'Stopped')"></p>
                            <p class="text-[11px] font-mono text-gray-500 mt-1"
                                x-text="zbStatus && zbStatus.pid ? 'PID ' + zbStatus.pid : 'no process'"></p>
                        </div>
                        <div class="bg-card border border-border rounded-2xl p-5">
                            <p class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Core</p>
                            <p class="text-2xl font-extrabold text-white capitalize"
                                x-text="zbLoading ? '...' : (zbStatus && zbStatus.core ? zbStatus.core : '—')"></p>
                            <p class="text-[11px] font-mono text-gray-500 mt-1"
                                x-text="zbStatus ? ('v' + (zbStatus.core_version || '?')) : ''"></p>
                        </div>
                        <div class="bg-card border border-border rounded-2xl p-5">
                            <p class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Routing Mode</p>
                            <p class="text-2xl font-extrabold text-[#f97815] uppercase"
                                x-text="zbLoading ? '...' : (zbStatus && zbStatus.effective_mode ? zbStatus.effective_mode : '—')"></p>
                            <p class="text-[11px] font-mono text-gray-500 mt-1">effective tier</p>
                        </div>
                        <div class="bg-card border border-border rounded-2xl p-5">
                            <p class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">CPU Cores</p>
                            <p class="text-2xl font-extrabold text-white"
                                x-text="zbLoading ? '...' : (zbSysinfo ? zbSysinfo.cpu_cores : '—')"></p>
                            <p class="text-[11px] font-mono text-gray-500 mt-1">device info</p>
                        </div>
                    </div>

                    <!-- Config summary -->
                    <div class="bg-card border border-border rounded-2xl p-5">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400">⚙️ Core Configuration</h3>
                            <button @click="fetchZengobox()" class="text-xs font-bold text-[#f97815] hover:text-white transition-colors">↻ Refresh</button>
                        </div>
                        <template x-if="zbConfig">
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 text-sm">
                                <div class="bg-white/5 border border-white/10 rounded-xl p-3">
                                    <p class="text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-1">Proxy Core</p>
                                    <p class="font-bold text-white capitalize" x-text="zbConfig.Core ? zbConfig.Core.BinName : '—'"></p>
                                    <p class="text-[11px] font-mono text-gray-500" x-text="zbConfig.Core ? 'variant: ' + (zbConfig.Core.ClashOption || '—') : ''"></p>
                                </div>
                                <div class="bg-white/5 border border-white/10 rounded-xl p-3">
                                    <p class="text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-1">Network</p>
                                    <p class="font-bold text-white uppercase" x-text="zbConfig.Network ? zbConfig.Network.Mode : '—'"></p>
                                    <p class="text-[11px] font-mono text-gray-500"
                                        x-text="zbConfig.Network ? ('tproxy ' + zbConfig.Network.TProxyPort + ' · redir ' + zbConfig.Network.RedirPort) : ''"></p>
                                </div>
                                <div class="bg-white/5 border border-white/10 rounded-xl p-3">
                                    <p class="text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-1">Proxy Mode</p>
                                    <p class="font-bold text-white capitalize" x-text="zbConfig.Proxy ? zbConfig.Proxy.Mode : '—'"></p>
                                    <p class="text-[11px] font-mono text-gray-500"
                                        x-text="zbConfig.Proxy && zbConfig.Proxy.Packages ? zbConfig.Proxy.Packages.length + ' packages' : '0 packages'"></p>
                                </div>
                                <div class="bg-white/5 border border-white/10 rounded-xl p-3 col-span-1 sm:col-span-2 lg:col-span-3">
                                    <p class="text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-2">Toggles</p>
                                    <div class="flex flex-wrap gap-2 text-[11px] font-bold" x-show="zbConfig.Network">
                                        <span class="px-2 py-1 rounded-lg border" :class="zbToggleChip(zbConfig.Network.IPv6)">IPv6</span>
                                        <span class="px-2 py-1 rounded-lg border" :class="zbToggleChip(zbConfig.Network.QUICBlock)">QUIC Block</span>
                                        <span class="px-2 py-1 rounded-lg border" :class="zbToggleChip(zbConfig.Network.ClashDNSForward)">DNS Forward</span>
                                        <span class="px-2 py-1 rounded-lg border" :class="zbToggleChip(zbConfig.Wifi && zbConfig.Wifi.Enabled)">Smart WiFi</span>
                                        <span class="px-2 py-1 rounded-lg border" :class="zbToggleChip(zbConfig.Schedule && zbConfig.Schedule.Enabled)">Cron</span>
                                        <span class="px-2 py-1 rounded-lg border" :class="zbToggleChip(zbConfig.Subscription && zbConfig.Subscription.InjectRules)">Rules Injector</span>
                                        <span class="px-2 py-1 rounded-lg border" :class="zbToggleChip(zbConfig.Geo && zbConfig.Geo.AutoUpdate)">Geo Update</span>
                                    </div>
                                </div>
                                <div class="bg-white/5 border border-white/10 rounded-xl p-3 col-span-1 sm:col-span-2 lg:col-span-3">
                                    <p class="text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-2">Supervision</p>
                                    <p class="text-xs font-mono text-gray-400"
                                        x-text="zbConfig.Process ? ('run as ' + zbConfig.Process.UserGroup + ' · max ' + zbConfig.Process.MaxRestarts + ' restarts / ' + zbConfig.Process.RestartWindow + ' · backoff ' + zbConfig.Process.RestartBackoff) : '—'"></p>
                                </div>
                            </div>
                        </template>
                        <template x-if="!zbConfig && !zbLoading">
                            <p class="text-xs text-gray-500">Could not load configuration.</p>
                        </template>
                    </div>

                    <!-- Apps -->
                    <div class="bg-card border border-border rounded-2xl p-5">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400">📱 Installed Apps <span class="text-gray-600" x-text="zbApps.length ? '(' + zbFilteredApps().length + '/' + zbApps.length + ')' : ''"></span></h3>
                            <div class="flex items-center gap-3">
                                <label class="flex items-center gap-1.5 text-[11px] text-gray-400 cursor-pointer select-none">
                                    <input type="checkbox" x-model="zbShowSystemApps" class="accent-[#f97815]"> System apps
                                </label>
                                <input x-model="zbAppFilter" type="text" placeholder="Filter apps..."
                                    class="bg-white/5 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-white placeholder-gray-600 outline-none focus:border-[#f97815]/60 w-40">
                            </div>
                        </div>
                        <div class="max-h-72 overflow-y-auto space-y-1 pr-1">
                            <template x-for="app in zbFilteredApps().slice(0, 200)" :key="app.package">
                                <div class="flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-white/[0.03] border border-white/5 hover:border-white/15 transition-colors">
                                    <div class="min-w-0">
                                        <p class="text-xs font-bold text-white truncate" x-text="app.label"></p>
                                        <p class="text-[10px] font-mono text-gray-500 truncate" x-text="app.package"></p>
                                    </div>
                                    <span x-show="app.system" class="shrink-0 text-[9px] font-extrabold uppercase tracking-wider text-purple-300 bg-purple-500/10 border border-purple-500/30 px-1.5 py-0.5 rounded">sys</span>
                                </div>
                            </template>
                            <template x-if="!zbLoading && zbFilteredApps().length === 0">
                                <p class="text-xs text-gray-500 text-center py-6">No apps match the filter.</p>
                            </template>
                        </div>
                    </div>

                    <!-- Proxy Accounts -->
                    <div class="bg-card border border-border rounded-2xl p-5" x-init="zbLoadAccounts()">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400">🔑 Proxy Accounts</h3>
                            <div class="flex items-center gap-2">
                                <select x-model="zbAcctFile" @change="zbLoadAccounts()"
                                    class="bg-white/5 border border-white/10 rounded-xl px-2 py-1.5 text-xs text-white outline-none focus:border-[#f97815]/60">
                                    <option value="AKUN-ID">AKUN-ID</option>
                                    <option value="AKUN-SG">AKUN-SG</option>
                                </select>
                                <select x-model="zbAcctCore" @change="zbLoadAccounts()"
                                    class="bg-white/5 border border-white/10 rounded-xl px-2 py-1.5 text-xs text-white outline-none focus:border-[#f97815]/60">
                                    <option value="clash">Clash</option>
                                    <option value="sing-box">Sing-Box</option>
                                </select>
                                <button @click="zbLoadAccounts()" class="text-xs font-bold text-[#f97815] hover:text-white transition-colors">↻</button>
                            </div>
                        </div>
                        <div class="flex flex-col sm:flex-row gap-2 mb-4">
                            <input x-model="zbLinkInput" type="text" placeholder="Paste vmess / vless / trojan link here..."
                                class="flex-1 bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder-gray-600 outline-none focus:border-[#f97815]/60 font-mono">
                            <button @click="zbConvertAndSave()" :disabled="zbAcctBusy || !zbLinkInput.trim()"
                                class="px-4 py-2 rounded-xl text-xs font-extrabold uppercase tracking-wider bg-[#f97815] text-black hover:brightness-110 transition disabled:opacity-40">＋ Add</button>
                        </div>
                        <div class="max-h-64 overflow-y-auto space-y-1 pr-1 mb-3">
                            <template x-for="name in zbAcctList" :key="name">
                                <div class="flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-white/[0.03] border border-white/5 hover:border-white/15 transition-colors">
                                    <p class="text-xs font-bold text-white truncate font-mono" x-text="name"></p>
                                    <button @click="zbDeleteAccount(name)"
                                        class="shrink-0 text-[10px] font-extrabold uppercase tracking-wider text-red-300 bg-red-500/10 border border-red-500/30 px-2 py-1 rounded-lg hover:bg-red-500/20">Delete</button>
                                </div>
                            </template>
                            <template x-if="zbAcctList.length === 0">
                                <p class="text-xs text-gray-500 text-center py-6">No accounts yet — paste a link above to add one.</p>
                            </template>
                        </div>
                        <button @click="zbOpenEditAll()" class="text-xs font-bold text-gray-400 hover:text-white transition-colors">✏️ Edit raw file</button>

                        <!-- Edit-all modal -->
                        <template x-if="zbEditAll">
                            <div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/70" @click.self="zbEditAll = false">
                                <div class="w-full max-w-2xl bg-card border border-border rounded-2xl p-5">
                                    <div class="flex items-center justify-between mb-3">
                                        <h4 class="text-xs font-bold uppercase tracking-wider text-gray-400">Edit <span x-text="zbAcctFileName()"></span></h4>
                                        <button @click="zbEditAll = false" class="text-gray-500 hover:text-white">✕</button>
                                    </div>
                                    <textarea x-model="zbEditAllText" rows="14"
                                        class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-[11px] font-mono text-gray-200 outline-none focus:border-[#f97815]/60"></textarea>
                                    <div class="flex justify-end gap-2 mt-3">
                                        <button @click="zbEditAll = false" class="px-4 py-2 rounded-xl text-xs font-bold text-gray-400 hover:text-white">Cancel</button>
                                        <button @click="zbApplyEditAll()" class="px-4 py-2 rounded-xl text-xs font-extrabold uppercase tracking-wider bg-[#f97815] text-black">Save</button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Live logs -->
                    <div class="bg-card border border-border rounded-2xl p-5">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400">📜 Live Logs</h3>
                            <div class="flex items-center gap-3">
                                <label class="flex items-center gap-1.5 text-[11px] text-gray-400 cursor-pointer select-none">
                                    <input type="checkbox" x-model="zbAutoScroll" class="accent-[#f97815]"> Auto-scroll
                                </label>
                                <button @click="zbToggleLogs()"
                                    class="px-3 py-1.5 rounded-xl text-xs font-extrabold uppercase tracking-wider border transition-colors"
                                    :class="zbLogsOn ? 'bg-red-500/15 border-red-500/40 text-red-300' : 'bg-green-500/15 border-green-500/40 text-green-300'"
                                    x-text="zbLogsOn ? '⏹ Stop' : '▶ Tail'"></button>
                            </div>
                        </div>
                        <pre id="zb-log-view"
                            class="h-56 overflow-y-auto bg-black/40 border border-white/10 rounded-xl p-3 text-[11px] font-mono text-gray-300 whitespace-pre-wrap"><template x-for="line in zbLogs" :key="line"><span x-text="line + '\n'"></span></template><span x-if="zbLogs.length === 0" class="text-gray-600">Press ▶ Tail to start streaming core logs.</span></pre>
                    </div>
                </div>
{{end}}
