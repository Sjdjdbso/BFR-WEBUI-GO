{{define "sidebar.html"}}
<template x-if="authenticated">
    <!-- Desktop: fixed left sidebar (AWDOS style) -->
    <div class="hidden lg:block shrink-0">
        <aside class="sticky top-0 h-screen w-72 flex flex-col bg-[#161617]/70 backdrop-blur-2xl border-r border-white/5 shadow-2xl">
            {{template "sidebar-nav.html" .}}
        </aside>
    </div>
    <!-- Mobile: slide-in drawer -->
    <div id="bfr-mobile-drawer" class="fixed inset-y-0 left-0 z-[95] w-72 max-w-[85vw] lg:hidden -translate-x-full transition-transform duration-300 ease-out">
        <aside class="h-full flex flex-col bg-[#161617]/95 backdrop-blur-3xl border-r border-white/10 shadow-2xl">
            {{template "sidebar-nav.html" .}}
        </aside>
    </div>
    <!-- Drawer overlay -->
    <div id="bfr-drawer-overlay" class="fixed inset-0 z-[90] bg-black/60 backdrop-blur-sm hidden lg:hidden" onclick="toggleBfrDrawer()"></div>
</template>
<script>
/* Sidebar drawer controls (AWDOS pattern, UI-only, no app logic touched) */
function toggleBfrDrawer() {
    var d = document.getElementById('bfr-mobile-drawer');
    var o = document.getElementById('bfr-drawer-overlay');
    if (!d || !o) return;
    var opening = d.classList.contains('-translate-x-full');
    d.classList.toggle('-translate-x-full', !opening);
    o.classList.toggle('hidden', !opening);
    document.body.classList.toggle('overflow-hidden', opening);
}
function bfrCloseDrawer() {
    var d = document.getElementById('bfr-mobile-drawer');
    var o = document.getElementById('bfr-drawer-overlay');
    if (d) d.classList.add('-translate-x-full');
    if (o) o.classList.add('hidden');
    document.body.classList.remove('overflow-hidden');
}
</script>
{{end}}
