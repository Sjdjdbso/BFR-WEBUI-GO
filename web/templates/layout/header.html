{{define "header.html"}}
    <!-- Slim top bar (AWDOS style): hamburger + page title + utility buttons.
         Main navigation lives in the left sidebar (sidebar.html). -->
    <header class="sticky top-0 z-[80] w-full border-b border-white/5 bg-[#141416]/70 backdrop-blur-2xl">
        <div class="px-4 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5 min-w-0 flex-1">
                <template x-if="authenticated">
                    <button type="button" onclick="toggleBfrDrawer()" title="Menu"
                        class="lg:hidden p-2 -ml-1.5 rounded-xl text-gray-300 hover:text-white hover:bg-white/10 transition select-none shrink-0">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                </template>
                <h1 class="text-base lg:text-lg font-extrabold tracking-tight text-white truncate"
                    x-text="!authenticated ? 'BFR WEBUI' : ({overview:'Overview',sysinfo:'System Info',logs:'System Logs',files:'File Manager',terminal:'Web Terminal',tools:'Tools & Modules',network:'Network & Tweaks',speedtest:'Speedtest',zengobox:'ZenGoBox',scrcpy:'Remote Screen',sms:'SMS Viewer',about:'About & Docs'}[activeTab] || 'BFR WEBUI')"></h1>
            </div>

            <div class="flex items-center gap-2 shrink-0">
                <button type="button" @click="toggleTheme()" class="theme-toggle px-2.5 py-1.5 text-xs font-extrabold flex items-center justify-center gap-1.5 transition-all duration-100 select-none">
                    <span x-show="isDark">🌙</span>
                    <span x-show="!isDark">☀️</span>
                    <span x-text="isDark ? 'Dark' : 'Light'"></span>
                </button>
                <template x-if="authenticated">
                    <button type="button" @click="showBackupModal = true" class="px-2.5 py-1.5 text-xs font-extrabold text-gray-300 hover:text-white bg-flat border border-border/60 rounded-xl transition select-none" title="Backup & Settings">
                        ⚙️
                    </button>
                </template>
                <template x-if="authenticated">
                    <button type="button" @click="logout()" class="px-3.5 py-1.5 text-xs font-medium text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 rounded-xl transition">
                        Logout
                    </button>
                </template>
            </div>
        </div>
    </header>
{{end}}
